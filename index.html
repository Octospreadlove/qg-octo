<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#101012"><title>QG OCTO · privé</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#101012;color:#f5f5f3;font:15px/1.6 'Avenir Next','Segoe UI',sans-serif;display:grid;place-items:center;padding:30px}main{width:min(100%,340px)}.label{color:#92929e;font-size:10px;letter-spacing:3px;margin-bottom:48px}h1{font-size:54px;letter-spacing:-3px;font-weight:600;line-height:1;margin:0 0 22px}.note{color:#9d9da6;font-size:13px;margin-bottom:40px}label{font-size:12px}input{width:100%;background:#1c1c21;color:white;border:1px solid #4a4a56;border-radius:9px;padding:14px;font:16px sans-serif;margin-top:10px}input:focus{outline:2px solid white;outline-offset:3px}button{border:0;cursor:pointer;border-radius:8px;padding:14px;font:600 13px sans-serif}button[type=submit]{width:100%;background:#efefeb;color:#151516;margin-top:20px;min-height:48px}button:disabled{opacity:.6}.show{background:transparent;color:#aaa;font-size:11px;float:right;padding:8px 0}.error{min-height:44px;margin-top:18px;color:#d0d0d8;font-size:12px}.fine{font-size:10px;color:#73737e;margin-top:30px;border-top:1px solid #303036;padding-top:18px}
</style></head><body><main><div class="label">TON ESPACE. TES PROJETS.</div><h1>QG OCTO.</h1><p class="note">Tout ce que tu prépares, à l’abri des regards.</p><form id="unlock"><label for="password">Mot de passe</label><input id="password" name="password" type="password" required autocomplete="current-password"><button type="button" class="show" id="show">Afficher</button><button type="submit" id="enter">Entrer au QG</button><div class="error" id="error" role="status"></div></form><p class="fine">Contenu chiffré. Aucun compte à créer.<br>Sur un appareil partagé, pense à verrouiller après ta visite.</p></main><script>
(()=>{
const $=s=>document.querySelector(s);$('#show').onclick=()=>{const p=$('#password');p.type=p.type==='password'?'text':'password';$('#show').textContent=p.type==='password'?'Afficher':'Masquer'};
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
$('#unlock').onsubmit=async e=>{e.preventDefault();const b=$('#enter');b.disabled=true;b.textContent='Ouverture…';$('#error').textContent='';try{const r=await fetch('./vault.json',{cache:'no-store'});if(!r.ok)throw new Error('network');const v=await r.json();if(v.iterations!==600000)throw new Error('format');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode($('#password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(v.salt),iterations:v.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(v.iv)},key,bytes(v.cipher));window.QG_KEY=key;$('#password').value='';const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close()}catch(err){$('#error').textContent=err.name==='OperationError'?'Ce mot de passe n’ouvre pas le QG. Réessaie.':'Impossible d’ouvrir le QG. Vérifie la connexion et réessaie.';b.disabled=false;b.textContent='Entrer au QG';$('#password').focus()}};
})();
</script></body></html>
